name: Sync Goodreads shelves

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "sync_goodreads.py"
      - ".github/workflows/sync-goodreads.yml"

permissions:
  contents: write

concurrency:
  group: goodreads-reading-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate sync script syntax
        run: python -m py_compile sync_goodreads.py

      - name: Fetch Goodreads shelves
        run: python sync_goodreads.py

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/goodreads.json data/history.jsonl
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Refresh Goodreads shelf snapshot"
            git push
          fi
