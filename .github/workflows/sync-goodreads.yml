name: Sync Goodreads shelves

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: goodreads-reading-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Diagnose Goodreads shelf feed responses
        run: |
          python - <<'PY'
          import urllib.error
          import urllib.parse
          import urllib.request

          user_id = "34901135"
          shelves = ["1st_priority", "1st-priority", "next", "currently-reading"]
          for shelf in shelves:
              query = urllib.parse.urlencode({"shelf": shelf, "page": 1})
              url = f"https://www.goodreads.com/review/list_rss/{user_id}?{query}"
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "goodreads-reading-sync/1.0 (personal read-only shelf diagnostic)",
                      "Accept": "application/rss+xml, application/xml, text/xml;q=0.9, */*;q=0.8",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      body = response.read()
                      print(
                          f"shelf={shelf!r} status={response.status} "
                          f"content_type={response.headers.get('Content-Type')} "
                          f"bytes={len(body)} final_url={response.geturl()}"
                      )
              except urllib.error.HTTPError as exc:
                  body = exc.read()
                  print(
                      f"shelf={shelf!r} status={exc.code} "
                      f"content_type={exc.headers.get('Content-Type')} "
                      f"bytes={len(body)} final_url={exc.geturl()}"
                  )
              except Exception as exc:
                  print(f"shelf={shelf!r} error={type(exc).__name__}: {exc}")
          PY

      - name: Fetch Goodreads shelves
        run: python sync_goodreads.py

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/goodreads.json data/history.jsonl
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Refresh Goodreads shelf snapshot"
            git push
          fi
