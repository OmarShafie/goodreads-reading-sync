name: Sync Goodreads shelves

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "sync_goodreads.py"
      - ".github/workflows/sync-goodreads.yml"

permissions:
  contents: write

concurrency:
  group: goodreads-reading-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate sync script syntax
        run: python -m py_compile sync_goodreads.py

      - name: Diagnose Goodreads and proxy access
        run: |
          python - <<'PY'
          import urllib.error
          import urllib.request

          urls = {
              "own_read_numeric": "https://www.goodreads.com/review/list_rss/34901135?shelf=read&page=1",
              "own_read_slug": "https://www.goodreads.com/review/list_rss/34901135-omar-shafie?shelf=read&page=1",
              "known_user_numeric": "https://www.goodreads.com/review/list_rss/1?shelf=read&page=1",
              "known_user_slug": "https://www.goodreads.com/review/list_rss/1-otis-chandler?shelf=read&page=1",
              "own_profile": "https://www.goodreads.com/user/show/34901135",
          }
          for label, url in urls.items():
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "goodreads-reading-sync/1.1 (read-only connectivity diagnostic)",
                           "Accept": "application/rss+xml, application/xml, text/xml;q=0.9, */*;q=0.8"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      body = response.read()
                      if label == "own_profile":
                          import re
                          links = re.findall(r'href="([^"]+)"', body.decode("utf-8", "replace"))
                          relevant = [link for link in links if "rss" in link.lower() or "review/list" in link.lower() or "bookshelf" in link.lower()]
                          print(f"{label}: status={response.status} relevant_links={relevant[:30]}")
                      elif label.startswith("own_review"):
                          page = body.decode("utf-8", "replace").lower()
                          print(f"{label}: status={response.status} type={response.headers.get('Content-Type')} bytes={len(body)} sign_in={'sign in' in page or 'log in' in page} review_rows={page.count('bookalike')}")
                      else:
                          print(f"{label}: status={response.status} type={response.headers.get('Content-Type')} bytes={len(body)} preview={body[:100]!r}")
              except urllib.error.HTTPError as exc:
                  body = exc.read(256)
                  print(f"{label}: status={exc.code} type={exc.headers.get('Content-Type')} preview={body[:100]!r}")
              except Exception as exc:
                  print(f"{label}: error={type(exc).__name__}: {exc}")
          PY

      - name: Fetch Goodreads shelves
        run: python sync_goodreads.py

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/goodreads.json data/history.jsonl
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Refresh Goodreads shelf snapshot"
            git push
          fi
